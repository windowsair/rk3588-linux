name: test/test
on:
  push:
  workflow_dispatch:
jobs:
  check-devicetrees:
    runs-on:
      - ubuntu-22.04
    container:
      image: debian:testing
    continue-on-error: true
    env:
      DEBIAN_FRONTEND: noninteractive
      GIT_SUBMODULE_STRATEGY: normal
      ARCH: arm64
      DEFCONFIG: defconfig
      CROSS_COMPILE: aarch64-linux-gnu-
      DUT: rockchip/rk3588s-rock-5a.dtb rockchip/rk3588-rock-5b.dtb rockchip/rk3588-rock-5b-plus.dtb rockchip/rk3588-evb1-v10.dtb rockchip/rk3576-armsom-sige5.dtb rockchip/rk3576-rock-4d.dtb rockchip/rk3576-evb1-v10.dtb
    steps:
    - uses: actions/checkout@v4.1.0
    - run: apt update
    - run: apt install -y devscripts build-essential crossbuild-essential-arm64 bc bison flex swig python3-dev python3-pip python3-setuptools yamllint
    - run: pip3 install --break-system-packages dtschema
    - run: make $DEFCONFIG
    - run: make -j$(nproc) dt_binding_check
    - run: make -j$(nproc) CHECK_DTBS=y $DUT 2> dt-warnings.txt
    - run: if [[ $(cat dt-warnings.txt | wc -l) > 0 ]]; then cat dt-warnings.txt; exit 42; fi
  build-arm64-debian-package:
    runs-on:
      - ubuntu-22.04
    container:
      image: debian:testing
    env:
      DEBIAN_FRONTEND: noninteractive
      GIT_SUBMODULE_STRATEGY: normal
      ARCH: arm64
      DEFCONFIG: defconfig
      CCACHE_BASEDIR: "${{ github.workspace }}"
      CCACHE_DIR: "${{ github.workspace }}/ccache"
      CROSS_COMPILE: aarch64-linux-gnu-
      ADDITIONAL_BUILD_CMD: KBUILD_IMAGE=arch/arm64/boot/Image
    steps:
    - uses: actions/checkout@v4.1.0
    - uses: actions/cache@v4
      with:
        path: ccache
        key: "${{ github.ref }}"
    - run: dpkg --add-architecture arm64
    - run: apt update
    - run: apt install -y devscripts build-essential crossbuild-essential-arm64 bc bison ccache flex rsync kmod cpio libdw-dev libelf-dev libssl-dev libssl-dev:arm64
    - run: export PATH="/usr/lib/ccache:$PATH"
    - run: ccache -s
    - run: make $DEFCONFIG
    - run: "./scripts/config -e WLAN -e WLAN_VENDOR_BROADCOM -m BRCMUTIL -m BRCMFMAC -e BRCMFMAC_PROTO_BCDC -e BRCMFMAC_PROTO_MSGBUF -e BRCMFMAC_USB -e WLAN_VENDOR_REALTEK -m RTW89 -m RTW89_CORE -e DYNAMIC_DEBUG -m RTW89_PCI -m RTW89_8825B -m RTW89_8852BE -m BINFMT_MISC -e WATCHDOG_SYSFS -e PM_DEBUG -m XFS_FS -m EROFS_FS -m F2FS_FS -m EXFAT_FS -m ISO9660_FS -e DRM_ACCEL -m DRM_ACCEL_ROCKET -m VIDEO_IMX415 -m PHY_ROCKCHIP_INNO_CSIDPHY"
    - run: make -j$(nproc) $ADDITIONAL_BUILD_CMD bindeb-pkg
    - run: mkdir artifacts && dcmd mv ../*.changes artifacts/
    - uses: actions/upload-artifact@v4.1.0
      if: success()
      with:
        name: "${{ github.job }}"
        path: artifacts
  build-arm64-kselftest-tarball:
    runs-on: ubuntu-latest
    container:
      image: debian:testing
    env:
      DEBIAN_FRONTEND: noninteractive
      GIT_SUBMODULE_STRATEGY: normal
      ARCH: arm64
      DEFCONFIG: defconfig
      CCACHE_BASEDIR: "${{ github.workspace }}"
      CCACHE_DIR: "${{ github.workspace }}/ccache"
      CROSS_COMPILE: aarch64-linux-gnu-
      ADDITIONAL_BUILD_CMD: KBUILD_IMAGE=arch/arm64/boot/Image
    steps:
    - uses: actions/checkout@v4.1.0
    - uses: actions/cache@v4
      with:
        path: ccache
        key: "${{ github.ref }}"
    - run: dpkg --add-architecture arm64
    - run: apt update
    - run: apt install -y devscripts build-essential crossbuild-essential-arm64 bc bison ccache flex rsync kmod cpio libelf-dev libssl-dev libssl-dev:arm64
    - run: mkdir artifacts
    - run: export PATH="/usr/lib/ccache:$PATH"
    - run: ccache -s
    - run: echo 'rockchip,rk3588-vepu121' >> tools/testing/selftests/dt/compatible_ignore_list
    - run: echo 'rockchip,rk3588-vdec' >> tools/testing/selftests/dt/compatible_ignore_list
    - run: echo 'haoyu,hym8563' >> tools/testing/selftests/dt/compatible_ignore_list
    - run: echo 'rockchip,rk3576-ufshc' >> tools/testing/selftests/dt/compatible_ignore_list
    - run: make -C tools/testing/selftests/ TARGETS="dt" gen_tar
    - run: mv tools/testing/selftests/kselftest_install/kselftest-packages/kselftest.tar.gz artifacts/
    - run: sed -i s,%%KSELFTEST_BUILD_JOB%%,${{ github.job }},g lava/testjob.yaml
    - uses: actions/upload-artifact@v4.1.0
      if: success()
      with:
        name: "${{ github.job }}"
        path: |-
          artifacts
          lava/testjob.yaml
