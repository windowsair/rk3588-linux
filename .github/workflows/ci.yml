name: ci/build
on:
  push:
  workflow_dispatch:
jobs:
  check-devicetrees:
    runs-on:
      - ubuntu-22.04
    container:
      image: debian:testing
    continue-on-error: true
    env:
      DEBIAN_FRONTEND: noninteractive
      GIT_SUBMODULE_STRATEGY: normal
      ARCH: arm64
      DEFCONFIG: defconfig
      CROSS_COMPILE: aarch64-linux-gnu-
      DUT: rockchip/rk3588s-rock-5a.dtb rockchip/rk3588-rock-5b.dtb rockchip/rk3588-rock-5b-plus.dtb rockchip/rk3588-evb1-v10.dtb rockchip/rk3576-armsom-sige5.dtb rockchip/rk3576-rock-4d.dtb rockchip/rk3576-evb1-v10.dtb
    steps:
    - uses: actions/checkout@v4.1.0
    - name: Install depend
      run: |
        apt update
        apt install -y devscripts build-essential crossbuild-essential-arm64 bc bison flex swig python3-dev python3-pip python3-setuptools yamllint
        pip3 install --break-system-packages dtschema
    - name: Run dt_binding_check
      run: |
        make $DEFCONFIG
        make -j$(nproc) dt_binding_check
        make -j$(nproc) CHECK_DTBS=y $DUT 2> dt-warnings.txt
    - name: Get check result
      run: if [[ $(cat dt-warnings.txt | wc -l) > 0 ]]; then cat dt-warnings.txt; exit 42; fi
      shell: bash
  build-arm64-debian-package:
    runs-on:
      - ubuntu-22.04
    container:
      image: debian:testing
    env:
      DEBIAN_FRONTEND: noninteractive
      GIT_SUBMODULE_STRATEGY: normal
      ARCH: arm64
      DEFCONFIG: defconfig
      CCACHE_BASEDIR: "${{ github.workspace }}"
      CCACHE_DIR: "${{ github.workspace }}/../ccache"
      CROSS_COMPILE: aarch64-linux-gnu-
      ADDITIONAL_BUILD_CMD: KBUILD_IMAGE=arch/arm64/boot/Image
    steps:
    - name: Install Depend
      run: |
        dpkg --add-architecture arm64
        apt update
        apt install -y git devscripts build-essential crossbuild-essential-arm64 bc bison ccache flex rsync kmod cpio libdw-dev libelf-dev libssl-dev libssl-dev:arm64
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Get git ownership
      run: |
        git config --global --add safe.directory $PWD
        git describe
    - name: Get ccache path
      id: ccache
      run: |
        CACHE_ABS_PATH=$(realpath "../ccache")
        echo "CACHE_SAVE_PATH=$CACHE_ABS_PATH" >> "$GITHUB_OUTPUT"
    - name: Restore cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.ccache.outputs.CACHE_SAVE_PATH }}
        key: "ccache-"
    - name: Get ccache stat before build
      run: |
        mkdir -p $CCACHE_DIR
        ccache -s
    - name: Make defconfig
      run: |
        make $DEFCONFIG
        ./scripts/config -e WLAN -e WLAN_VENDOR_BROADCOM -m BRCMUTIL -m BRCMFMAC \
          -e BRCMFMAC_PROTO_BCDC -e BRCMFMAC_PROTO_MSGBUF -e BRCMFMAC_USB \
          -e WLAN_VENDOR_REALTEK -m RTW89 -m RTW89_CORE -e DYNAMIC_DEBUG -m RTW89_PCI \
          -m RTW89_8825B -m RTW89_8852BE -m BINFMT_MISC -e WATCHDOG_SYSFS -e PM_DEBUG \
          -m XFS_FS -m EROFS_FS -m F2FS_FS -m EXFAT_FS -m ISO9660_FS -e DRM_ACCEL \
          -m DRM_ACCEL_ROCKET -m VIDEO_IMX415 -m PHY_ROCKCHIP_INNO_CSIDPHY \
          -e ROCKCHIP_MULTI_RGA -e ROCKCHIP_RGA_ASYNC -e ROCKCHIP_RGA_DEBUG_FS \
          -m ROCKCHIP_MPP_SERVICE -e ROCKCHIP_MPP_PROC_FS -e ROCKCHIP_MPP_RKVDEC2 \
          -e ROCKCHIP_MPP_RKVENC2 -e ROCKCHIP_MPP_JPGDEC -e ROCKCHIP_MPP_JPGENC
    - name: Build
      run: |
        export PATH="/usr/lib/ccache:$PATH"
        make -j$(nproc) $ADDITIONAL_BUILD_CMD bindeb-pkg
    - name: Upload package
      run: mkdir artifacts && dcmd mv ../*.changes artifacts/
    - name: Get ccache stat after build
      run: |
        ccache -s
    - name: Save cache
      uses: actions/cache/save@v4
      with:
        path: ${{ steps.ccache.outputs.CACHE_SAVE_PATH }}
        key: "ccache-${{ github.run_id }}"
    - uses: actions/upload-artifact@v4.1.0
      if: success()
      with:
        name: "${{ github.job }}"
        path: artifacts
